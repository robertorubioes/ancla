# Bloque de nginx para el entorno LOCAL de este proyecto.
# Instalar: ~/Devs/estandar/scripts/nginx-local.sh <carpeta-del-proyecto> firmalum
# __PROYECTO__ es la carpeta del proyecto; el script pone la ruta real.
# Guía: estandar/docs/RETOMAR.md, «Entorno local».

#------------------------------------------------------------------------------
# Firmalum - entorno LOCAL
#
# Convencion de entornos (§8 del estandar):
#   local       *.firmalum.test        <- este fichero
#   testing     *.test.firmalum.com
#   produccion  *.firmalum.com
#
# El comodin cubre tanto app.firmalum.test como los subdominios de tenant
# (acme.app.firmalum.test). La resolucion la da dnsmasq, no /etc/hosts:
#   ~/.claude/scripts/setup-dominios-locales.sh
#------------------------------------------------------------------------------

server {
    listen 80;
    server_name firmalum.test *.firmalum.test;
    root __PROYECTO__/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Los PDF de plantilla y los documentos subidos pueden ser grandes
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Generar un PDF grande o sellar en la TSA puede pasar de 60s
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
